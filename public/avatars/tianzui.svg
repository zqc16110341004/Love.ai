<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0e14"/>
      <stop offset="50%" style="stop-color:#1a1025"/>
      <stop offset="100%" style="stop-color:#0e0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8828a"/>
      <stop offset="100%" style="stop-color:#c8786a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Abstract heart shape -->
  <path d="M100 60 C80 40, 50 50, 50 80 C50 110, 80 130, 100 150 C120 130, 150 110, 150 80 C150 50, 120 40, 100 60" fill="url(#accent)" opacity="0.6"/>
  <!-- Subtle glow circle -->
  <circle cx="100" cy="100" r="60" fill="url(#accent)" opacity="0.15"/>
</svg>